name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release-metadata:
    name: Check release metadata
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Match tag, workspace version, and changelog
        run: bash scripts/check_release_metadata.sh "$GITHUB_REF_NAME"

  format:
    name: Check formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-advisories:
    name: Security advisories
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Reject vulnerable or unsound Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --locked

  lint-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude cterm-cocoa --exclude cterm-win32 --all-targets -- -D warnings

  lint-macos:
    name: Clippy (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        run: brew install protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude cterm-gtk --exclude cterm-win32 --all-targets -- -D warnings

  lint-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        run: choco install protoc -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude cterm-cocoa --exclude cterm-gtk --all-targets -- -D warnings

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    needs: [format, lint-linux]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            protobuf-compiler \
            weston

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --exclude cterm-cocoa --exclude cterm-win32 --lib

      - name: Build ctermd for integration tests
        run: cargo build -p cterm-headless

      - name: Run ctermd integration tests
        run: cargo test -p cterm-headless --test grpc_integration -- --test-threads=1

      - name: Build cterm for UI tests
        run: cargo build -p cterm

      - name: Run Wayland pane UI/action test
        run: |
          OUTPUT_DIR="${{ runner.temp }}/cterm_ui_test"
          mkdir -p "$OUTPUT_DIR"
          chmod +x scripts/linux_ui_test.sh
          export XDG_RUNTIME_DIR="${{ runner.temp }}/cterm-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          weston \
            --backend=headless-backend.so \
            --socket=cterm-ci \
            --idle-time=0 \
            --log="$OUTPUT_DIR/weston.log" &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          export WAYLAND_DISPLAY=cterm-ci
          export GDK_BACKEND=wayland
          export GSK_RENDERER=cairo
          ./scripts/linux_ui_test.sh target/debug/cterm "$OUTPUT_DIR"
        timeout-minutes: 5

      - name: Upload UI test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-ui-test-results
          path: ${{ runner.temp }}/cterm_ui_test/
          if-no-files-found: ignore

  test-freebsd:
    name: Build and test (FreeBSD 14.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: format
    steps:
      - uses: actions/checkout@v7

      # This gate qualifies the native GTK build and local daemon stack. The
      # compositor-backed Wayland smoke test is intentionally a separate slice.
      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: 14.4
          usesh: true
          prepare: |
            pkg install -y \
              git \
              gtk4 \
              libadwaita \
              pkgconf \
              protobuf \
              rust
          run: |
            cargo build --locked -p cterm -p cterm-headless
            cargo test --locked --workspace --exclude cterm-cocoa --exclude cterm-win32 --lib
            cargo test --locked -p cterm-headless --test grpc_integration -- --test-threads=1

            mkdir -p freebsd-ui-binaries
            install -m 0755 \
              target/debug/cterm \
              target/debug/ctermd \
              freebsd-ui-binaries/

      - name: Upload FreeBSD UI binaries
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-ui-binaries
          path: freebsd-ui-binaries/
          if-no-files-found: error
          retention-days: 1

  test-freebsd-ui:
    name: UI smoke (FreeBSD 14.4, Wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test-freebsd
    steps:
      - uses: actions/checkout@v7

      - name: Download qualified FreeBSD binaries
        uses: actions/download-artifact@v8
        with:
          name: freebsd-ui-binaries
          path: freebsd-ui-binaries

      - name: Run compositor-backed UI contract in FreeBSD VM
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: 14.4
          usesh: true
          prepare: |
            pkg install -y \
              bash \
              cage \
              coreutils \
              dbus \
              dejavu \
              gtk4 \
              libadwaita
          run: |
            OUTPUT_DIR="freebsd-ui-test-results"
            mkdir -p "$OUTPUT_DIR"
            chmod +x \
              freebsd-ui-binaries/cterm \
              freebsd-ui-binaries/ctermd \
              scripts/linux_ui_test.sh

            {
              uname -a
              freebsd-version -ku
              pkg info bash cage dbus dejavu gtk4 libadwaita
              command -v cage
              command -v dbus-run-session
              fc-match monospace
            } >"$OUTPUT_DIR/environment.log" 2>&1

            unset DISPLAY
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 0700 "$XDG_RUNTIME_DIR"
            export GDK_BACKEND=wayland
            export GSK_RENDERER=cairo
            export WLR_BACKENDS=headless
            export WLR_RENDERER=pixman
            export WLR_HEADLESS_OUTPUTS=1
            export WLR_LIBINPUT_NO_DEVICES=1

            ui_status=0
            # Keep the VM action alive long enough to copy its workspace back
            # to the runner even when Cage, cterm, or a descendant wedges.
            # Run Cage directly so GNU timeout owns the whole compositor/client
            # process group and can escalate to SIGKILL. wlheadless-run creates
            # a new process group internally, which lets wedged descendants
            # escape timeout's cleanup.
            gtimeout --signal=TERM --kill-after=10s 3m \
              dbus-run-session -- \
                cage -- \
                  env -u DISPLAY \
                  ./scripts/linux_ui_test.sh \
                  ./freebsd-ui-binaries/cterm \
                  "$OUTPUT_DIR" \
                  >"$OUTPUT_DIR/wlheadless.log" 2>&1 || ui_status=$?
            printf '%s\n' "$ui_status" >"$OUTPUT_DIR/exit-code"
            rm -rf -- "$XDG_RUNTIME_DIR"

      - name: Upload FreeBSD UI test diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: freebsd-wayland-ui-test-results
          path: freebsd-ui-test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce FreeBSD Wayland UI result
        if: always()
        shell: bash
        run: |
          STATUS_FILE="freebsd-ui-test-results/exit-code"
          if [[ ! -s "$STATUS_FILE" ]]; then
            echo "FreeBSD UI smoke did not produce an exit status" >&2
            find freebsd-ui-test-results -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          read -r UI_STATUS <"$STATUS_FILE"
          if [[ "$UI_STATUS" != "0" ]]; then
            echo "FreeBSD Wayland UI smoke failed with exit code $UI_STATUS" >&2
            for LOG_FILE in \
              freebsd-ui-test-results/environment.log \
              freebsd-ui-test-results/wlheadless.log \
              freebsd-ui-test-results/test.log \
              freebsd-ui-test-results/cterm.stderr.log \
              freebsd-ui-test-results/cterm.log; do
              if [[ -f "$LOG_FILE" ]]; then
                echo "===== $LOG_FILE =====" >&2
                sed -n '1,240p' "$LOG_FILE" >&2
              fi
            done
            exit 1
          fi

  compatibility-linux:
    name: Compatibility (foot + real TUIs)
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    timeout-minutes: 15
    needs: [format, lint-linux]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies and reference applications
        run: |
          pacman -Syu --noconfirm --needed \
            curl \
            foot \
            git \
            gtk4 \
            libadwaita \
            neovim \
            protobuf \
            tmux \
            weston \
            xorg-server-xvfb

      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run real TUI sessions through cterm
        run: cargo test -p cterm-core --test tui_e2e -- --ignored --test-threads=1

      - name: Build cterm, ctermd, and differential probe
        run: |
          cargo build -p cterm -p cterm-headless
          cargo build -p cterm-core --example foot_compat_probe

      - name: Compare cterm behavior with foot
        run: |
          OUTPUT_DIR="test-results/compatibility"
          mkdir -p "$OUTPUT_DIR"
          chmod +x scripts/foot_compat_test.sh
          export XDG_RUNTIME_DIR="${{ runner.temp }}/cterm-compat-xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 \
            -screen 0 1024x768x24 \
            -nolisten tcp \
            >"$OUTPUT_DIR/xvfb.log" 2>&1 &
          XVFB_PID=$!
          for ATTEMPT in $(seq 1 40); do
            if [ -S /tmp/.X11-unix/X99 ]; then
              break
            fi
            if [ "$ATTEMPT" -eq 40 ]; then
              cat "$OUTPUT_DIR/xvfb.log"
              exit 1
            fi
            sleep 0.25
          done
          export DISPLAY=:99
          weston \
            --backend=x11-backend.so \
            --use-pixman \
            --socket=cterm-compat-ci \
            --idle-time=0 \
            --log="$OUTPUT_DIR/weston.log" &
          WESTON_PID=$!
          cleanup_compositors() {
            kill "$WESTON_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup_compositors EXIT
          export WAYLAND_DISPLAY=cterm-compat-ci
          ./scripts/foot_compat_test.sh \
            target/debug/cterm \
            target/debug/ctermd \
            target/debug/examples/foot_compat_probe \
            "$OUTPUT_DIR"

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-compatibility-results
          path: test-results/compatibility/
          if-no-files-found: ignore

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: [format, lint-macos]
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        run: brew install protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --exclude cterm-gtk --exclude cterm-win32 --lib

      - name: Build ctermd for integration tests
        run: cargo build -p cterm-headless

      - name: Run ctermd integration tests
        run: cargo test -p cterm-headless --test grpc_integration -- --test-threads=1

      - name: Build cterm for UI tests
        run: cargo build -p cterm

      - name: Run UI automation test
        run: |
          OUTPUT_DIR="${{ runner.temp }}/cterm_ui_test"
          chmod +x scripts/macos_ui_test.sh
          ./scripts/macos_ui_test.sh target/debug/cterm "$OUTPUT_DIR"
        timeout-minutes: 5

      - name: Upload UI test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-ui-test-results
          path: ${{ runner.temp }}/cterm_ui_test/
          if-no-files-found: ignore

  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: [test-linux, compatibility-linux]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cterm, ctermd, and plugin host
        run: cargo build --release -p cterm -p cterm-headless -p cterm-plugin-host

      - name: List built binaries
        run: ls -la target/release/cterm* || true

      - name: Generate app icon
        run: |
          # Install librsvg for SVG to PNG conversion
          sudo apt-get install -y librsvg2-bin

          # Get version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Building icon for version: $VERSION"

          # Generate SVG with version substituted
          sed "s/{{VERSION}}/$VERSION/g" packaging/linux/icon_template.svg > /tmp/cterm_icon.svg

          # Generate PNG icons at standard sizes
          mkdir -p /tmp/icons
          for size in 16 24 32 48 64 128 256 512; do
            rsvg-convert -w $size -h $size /tmp/cterm_icon.svg > "/tmp/icons/cterm_${size}x${size}.png"
          done

          # Copy SVG as well
          cp /tmp/cterm_icon.svg /tmp/icons/cterm.svg
          echo "Generated icons:"
          ls -la /tmp/icons/

      - name: Create release archive
        run: |
          mkdir -p release/cterm-linux-x86_64/icons
          cp target/release/cterm release/cterm-linux-x86_64/
          cp target/release/ctermd release/cterm-linux-x86_64/
          cp target/release/cterm-plugin-host release/cterm-linux-x86_64/
          cp README.md LICENSE release/cterm-linux-x86_64/
          cp THIRD_PARTY_LICENSES.md release/cterm-linux-x86_64/
          cp -R LICENSES release/cterm-linux-x86_64/
          cp /tmp/icons/* release/cterm-linux-x86_64/icons/
          cd release && tar -czvf cterm-linux-x86_64.tar.gz cterm-linux-x86_64

      - name: Create ctermd release archive
        run: |
          mkdir -p release/ctermd-linux-x86_64
          cp target/release/ctermd release/ctermd-linux-x86_64/
          cp README.md LICENSE release/ctermd-linux-x86_64/
          cp THIRD_PARTY_LICENSES.md release/ctermd-linux-x86_64/
          cp -R LICENSES release/ctermd-linux-x86_64/
          cd release && tar -czvf ctermd-linux-x86_64.tar.gz ctermd-linux-x86_64

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum cterm-linux-x86_64.tar.gz > cterm-linux-x86_64.tar.gz.sha256
          sha256sum ctermd-linux-x86_64.tar.gz > ctermd-linux-x86_64.tar.gz.sha256

      - name: Verify packaging contract
        run: |
          (cd release && sha256sum --check cterm-linux-x86_64.tar.gz.sha256 ctermd-linux-x86_64.tar.gz.sha256)
          bash scripts/verify_release_package.sh client-tar release/cterm-linux-x86_64.tar.gz cterm-linux-x86_64
          bash scripts/verify_release_package.sh daemon-tar release/ctermd-linux-x86_64.tar.gz ctermd-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-linux-x86_64
          path: |
            release/cterm-linux-x86_64.tar.gz
            release/cterm-linux-x86_64.tar.gz.sha256

      - name: Upload ctermd artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctermd-linux-x86_64
          path: |
            release/ctermd-linux-x86_64.tar.gz
            release/ctermd-linux-x86_64.tar.gz.sha256

  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-22.04-arm
    needs: [test-linux, compatibility-linux]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libglib2.0-dev \
            protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cterm, ctermd, and plugin host
        run: cargo build --release -p cterm -p cterm-headless -p cterm-plugin-host

      - name: List built binaries
        run: ls -la target/release/cterm* || true

      - name: Generate app icon
        run: |
          # Install librsvg for SVG to PNG conversion
          sudo apt-get install -y librsvg2-bin

          # Get version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Building icon for version: $VERSION"

          # Generate SVG with version substituted
          sed "s/{{VERSION}}/$VERSION/g" packaging/linux/icon_template.svg > /tmp/cterm_icon.svg

          # Generate PNG icons at standard sizes
          mkdir -p /tmp/icons
          for size in 16 24 32 48 64 128 256 512; do
            rsvg-convert -w $size -h $size /tmp/cterm_icon.svg > "/tmp/icons/cterm_${size}x${size}.png"
          done

          # Copy SVG as well
          cp /tmp/cterm_icon.svg /tmp/icons/cterm.svg
          echo "Generated icons:"
          ls -la /tmp/icons/

      - name: Create release archive
        run: |
          mkdir -p release/cterm-linux-arm64/icons
          cp target/release/cterm release/cterm-linux-arm64/
          cp target/release/ctermd release/cterm-linux-arm64/
          cp target/release/cterm-plugin-host release/cterm-linux-arm64/
          cp README.md LICENSE release/cterm-linux-arm64/
          cp THIRD_PARTY_LICENSES.md release/cterm-linux-arm64/
          cp -R LICENSES release/cterm-linux-arm64/
          cp /tmp/icons/* release/cterm-linux-arm64/icons/
          cd release && tar -czvf cterm-linux-arm64.tar.gz cterm-linux-arm64

      - name: Create ctermd release archive
        run: |
          mkdir -p release/ctermd-linux-arm64
          cp target/release/ctermd release/ctermd-linux-arm64/
          cp README.md LICENSE release/ctermd-linux-arm64/
          cp THIRD_PARTY_LICENSES.md release/ctermd-linux-arm64/
          cp -R LICENSES release/ctermd-linux-arm64/
          cd release && tar -czvf ctermd-linux-arm64.tar.gz ctermd-linux-arm64

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum cterm-linux-arm64.tar.gz > cterm-linux-arm64.tar.gz.sha256
          sha256sum ctermd-linux-arm64.tar.gz > ctermd-linux-arm64.tar.gz.sha256

      - name: Verify packaging contract
        run: |
          (cd release && sha256sum --check cterm-linux-arm64.tar.gz.sha256 ctermd-linux-arm64.tar.gz.sha256)
          bash scripts/verify_release_package.sh client-tar release/cterm-linux-arm64.tar.gz cterm-linux-arm64
          bash scripts/verify_release_package.sh daemon-tar release/ctermd-linux-arm64.tar.gz ctermd-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-linux-arm64
          path: |
            release/cterm-linux-arm64.tar.gz
            release/cterm-linux-arm64.tar.gz.sha256

      - name: Upload ctermd artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctermd-linux-arm64
          path: |
            release/ctermd-linux-arm64.tar.gz
            release/ctermd-linux-arm64.tar.gz.sha256

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [format, lint-windows]
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        run: choco install protoc -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --exclude cterm-cocoa --exclude cterm-gtk --lib

      - name: Build ctermd for integration tests
        run: cargo build -p cterm-headless

      - name: Run ctermd integration tests
        run: cargo test -p cterm-headless --test grpc_integration -- --test-threads=1

      - name: Build cterm for UI tests
        run: cargo build -p cterm

      - name: Run UI automation test
        shell: pwsh
        run: |
          $OutputDir = "${{ runner.temp }}\cterm_ui_test"
          .\scripts\windows_ui_test.ps1 -CtermPath "target\debug\cterm.exe" -OutputDir $OutputDir
        timeout-minutes: 5

      - name: Upload UI test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-ui-test-results
          path: ${{ runner.temp }}/cterm_ui_test/
          if-no-files-found: ignore

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test-windows
    steps:
      - uses: actions/checkout@v7

      - name: Install protobuf
        run: choco install protoc -y

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build cterm, ctermd, and plugin host
        run: cargo build --release -p cterm -p cterm-headless -p cterm-plugin-host

      - name: List built binaries
        shell: pwsh
        run: Get-ChildItem target/release/cterm*

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/cterm-windows-x86_64
          Copy-Item target/release/cterm.exe release/cterm-windows-x86_64/
          Copy-Item target/release/ctermd.exe release/cterm-windows-x86_64/
          Copy-Item target/release/cterm-plugin-host.exe release/cterm-windows-x86_64/
          Copy-Item README.md release/cterm-windows-x86_64/
          Copy-Item LICENSE release/cterm-windows-x86_64/
          Copy-Item THIRD_PARTY_LICENSES.md release/cterm-windows-x86_64/
          Copy-Item LICENSES release/cterm-windows-x86_64/LICENSES -Recurse

      - name: Prepare ctermd release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/ctermd-windows-x86_64
          Copy-Item target/release/ctermd.exe release/ctermd-windows-x86_64/
          Copy-Item README.md release/ctermd-windows-x86_64/
          Copy-Item LICENSE release/ctermd-windows-x86_64/
          Copy-Item THIRD_PARTY_LICENSES.md release/ctermd-windows-x86_64/
          Copy-Item LICENSES release/ctermd-windows-x86_64/LICENSES -Recurse

      - name: Install NSIS and ImageMagick
        shell: pwsh
        run: |
          choco install nsis imagemagick 7zip -y

      - name: Generate app icon
        shell: pwsh
        run: |
          # Get version from Cargo.toml
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "Building icon for version: $version"

          # Read template and substitute version
          $template = Get-Content -Path packaging/windows/icon_template.svg -Raw
          $svg = $template -replace '\{\{VERSION\}\}', $version
          Set-Content -Path release/cterm_icon.svg -Value $svg

          # Convert SVG to ICO using ImageMagick
          # Create multiple sizes for a proper ICO file
          $sizes = @(16, 32, 48, 64, 128, 256)
          $pngFiles = @()
          foreach ($size in $sizes) {
            $pngFile = "release/icon_${size}.png"
            & magick convert -background none -resize "${size}x${size}" release/cterm_icon.svg $pngFile
            $pngFiles += $pngFile
          }

          # Combine PNGs into ICO
          & magick convert $pngFiles release/cterm.ico
          Write-Host "Generated icon:"
          Get-Item release/cterm.ico

      - name: Create installer
        shell: pwsh
        run: |
          # Get version from Cargo.toml
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value

          # Copy installer script, LICENSE, and icon to release directory
          Copy-Item packaging/windows/installer.nsi release/
          Copy-Item LICENSE release/
          # Icon is already in release/ from the generate step

          # Run NSIS
          cd release
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version installer.nsi

          # Rename output to standard name
          Move-Item "cterm-$version-setup.exe" "cterm-windows-x86_64-setup.exe"

      - name: Create zip for auto-update
        shell: pwsh
        run: |
          Compress-Archive -Path release/cterm-windows-x86_64 -DestinationPath release/cterm-windows-x86_64.zip

      - name: Create ctermd zip
        shell: pwsh
        run: |
          Compress-Archive -Path release/ctermd-windows-x86_64 -DestinationPath release/ctermd-windows-x86_64.zip

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $assets = @(
            "release/cterm-windows-x86_64.zip",
            "release/cterm-windows-x86_64-setup.exe",
            "release/ctermd-windows-x86_64.zip"
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $filename = Split-Path -Leaf $asset
            $sidecar = [System.IO.Path]::GetFullPath("$asset.sha256")
            [System.IO.File]::WriteAllText(
              $sidecar,
              "$hash  $filename`n",
              [System.Text.Encoding]::ASCII
            )
          }

      - name: Verify packaging contract
        shell: pwsh
        run: |
          ./scripts/verify_windows_release.ps1 `
            -ClientZip release/cterm-windows-x86_64.zip `
            -DaemonZip release/ctermd-windows-x86_64.zip `
            -Installer release/cterm-windows-x86_64-setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-windows-installer
          path: |
            release/cterm-windows-x86_64-setup.exe
            release/cterm-windows-x86_64-setup.exe.sha256

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-windows-x86_64
          path: |
            release/cterm-windows-x86_64.zip
            release/cterm-windows-x86_64.zip.sha256

      - name: Upload ctermd zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctermd-windows-x86_64
          path: |
            release/ctermd-windows-x86_64.zip
            release/ctermd-windows-x86_64.zip.sha256

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-15-intel
    needs: test-macos
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita pango cairo glib pkg-config protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Build ctermd and plugin host explicitly
        run: cargo build --release -p cterm-headless -p cterm-plugin-host

      - name: List built binaries
        run: ls -la target/release/cterm* || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-macos-x86_64-binary
          path: target/release/cterm

      - name: Upload ctermd binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctermd-macos-x86_64-binary
          path: target/release/ctermd

      - name: Upload plugin host binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-plugin-host-macos-x86_64-binary
          path: target/release/cterm-plugin-host

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: build-macos-intel
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install gtk4 libadwaita pango cairo glib pkg-config protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Build ctermd and plugin host explicitly
        run: cargo build --release -p cterm-headless -p cterm-plugin-host

      - name: List built binaries
        run: ls -la target/release/cterm* || true

      - name: Download Intel binary
        uses: actions/download-artifact@v8
        with:
          name: cterm-macos-x86_64-binary
          path: intel-binary

      - name: Download Intel ctermd binary
        uses: actions/download-artifact@v8
        with:
          name: ctermd-macos-x86_64-binary
          path: intel-binary-ctermd

      - name: Download Intel plugin host binary
        uses: actions/download-artifact@v8
        with:
          name: cterm-plugin-host-macos-x86_64-binary
          path: intel-binary-plugin-host

      - name: Create universal binaries
        run: |
          mkdir -p universal-binary
          # Create universal cterm binary
          lipo -create -output universal-binary/cterm \
            intel-binary/cterm \
            target/release/cterm
          chmod +x universal-binary/cterm
          # Create universal ctermd binary
          lipo -create -output universal-binary/ctermd \
            intel-binary-ctermd/ctermd \
            target/release/ctermd
          chmod +x universal-binary/ctermd
          # Create universal plugin host binary
          lipo -create -output universal-binary/cterm-plugin-host \
            intel-binary-plugin-host/cterm-plugin-host \
            target/release/cterm-plugin-host
          chmod +x universal-binary/cterm-plugin-host
          # Verify they're universal
          file universal-binary/cterm universal-binary/ctermd universal-binary/cterm-plugin-host
          lipo -info universal-binary/cterm
          lipo -info universal-binary/ctermd
          lipo -info universal-binary/cterm-plugin-host

      - name: Generate app icon
        run: |
          # Install librsvg for SVG to PNG conversion
          brew install librsvg

          # Get version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Building icon for version: $VERSION"

          # Use macOS-specific icon template
          sed "s/{{VERSION}}/$VERSION/g" packaging/macos/icon_template.svg > /tmp/cterm_icon.svg

          # Create iconset directory
          mkdir -p /tmp/cterm.iconset

          # Generate PNG files at all required sizes
          for size in 16 32 64 128 256 512; do
            rsvg-convert -w $size -h $size /tmp/cterm_icon.svg > "/tmp/cterm.iconset/icon_${size}x${size}.png"
            # Also create @2x versions for Retina displays
            double=$((size * 2))
            if [ $double -le 1024 ]; then
              rsvg-convert -w $double -h $double /tmp/cterm_icon.svg > "/tmp/cterm.iconset/icon_${size}x${size}@2x.png"
            fi
          done

          # Create .icns file
          iconutil -c icns /tmp/cterm.iconset -o packaging/macos/cterm.icns
          echo "Generated icon:"
          ls -la packaging/macos/cterm.icns

      - name: Create app bundle
        run: |
          APP_DIR="release/cterm.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          # Copy binaries
          cp universal-binary/cterm "$APP_DIR/Contents/MacOS/"
          cp universal-binary/ctermd "$APP_DIR/Contents/MacOS/"
          cp universal-binary/cterm-plugin-host "$APP_DIR/Contents/MacOS/"

          # Copy generated icon
          cp packaging/macos/cterm.icns "$APP_DIR/Contents/Resources/"

          # Ship the product and inherited-source licenses inside the app.
          cp LICENSE THIRD_PARTY_LICENSES.md "$APP_DIR/Contents/Resources/"
          cp -R LICENSES "$APP_DIR/Contents/Resources/"

          # Get version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # Create Info.plist with version substitution
          sed "s/\${VERSION}/$VERSION/g" packaging/macos/Info.plist > "$APP_DIR/Contents/Info.plist"

          # Create PkgInfo
          echo -n "APPL????" > "$APP_DIR/Contents/PkgInfo"

      - name: Detect Apple distribution credentials
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGNING_AVAILABLE=false
          NOTARIZATION_AVAILABLE=false

          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            SIGNING_AVAILABLE=true
          fi
          if [ "$SIGNING_AVAILABLE" = true ] && \
             [ -n "$APPLE_ID" ] && [ -n "$APPLE_ID_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            NOTARIZATION_AVAILABLE=true
          fi

          echo "APPLE_SIGNING_AVAILABLE=$SIGNING_AVAILABLE" >> "$GITHUB_ENV"
          echo "APPLE_NOTARIZATION_AVAILABLE=$NOTARIZATION_AVAILABLE" >> "$GITHUB_ENV"

          if [ "$SIGNING_AVAILABLE" != true ]; then
            echo "::warning title=Ad-hoc macOS signature::Apple Developer ID certificate credentials are unavailable. Release artifacts will be ad-hoc signed and will not be notarized."
          elif [ "$NOTARIZATION_AVAILABLE" != true ]; then
            echo "::warning title=macOS notarization skipped::Apple notarization credentials are incomplete. Artifacts will be Developer ID signed but not notarized."
          fi

      - name: Import signing certificate
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12

          # Create a temporary keychain
          KEYCHAIN_PATH="/tmp/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Clean up certificate file
          rm /tmp/certificate.p12

      - name: Sign app bundle
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $IDENTITY"

          # Sign ctermd first (must be signed before the main binary)
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign "$IDENTITY" \
            --timestamp \
            "release/cterm.app/Contents/MacOS/ctermd"

          # Sign the isolated plugin host before sealing the app bundle.
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign "$IDENTITY" \
            --timestamp \
            "release/cterm.app/Contents/MacOS/cterm-plugin-host"

          # Sign the main binary inside the bundle with hardened runtime
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign "$IDENTITY" \
            --timestamp \
            "release/cterm.app/Contents/MacOS/cterm"

          # Sign the app bundle itself
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign "$IDENTITY" \
            --timestamp \
            "release/cterm.app"

          # Verify
          codesign --verify --deep --strict --verbose=2 "release/cterm.app"

      - name: Ad-hoc sign app bundle
        if: env.APPLE_SIGNING_AVAILABLE != 'true'
        run: |
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign - \
            "release/cterm.app/Contents/MacOS/ctermd"
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign - \
            "release/cterm.app/Contents/MacOS/cterm-plugin-host"
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign - \
            "release/cterm.app/Contents/MacOS/cterm"
          codesign --force --options runtime \
            --entitlements packaging/macos/cterm.entitlements \
            --sign - \
            "release/cterm.app"
          codesign --verify --deep --strict --verbose=2 "release/cterm.app"

      - name: Notarize app bundle
        if: env.APPLE_NOTARIZATION_AVAILABLE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Create a zip for notarization submission
          ditto -c -k --keepParent "release/cterm.app" /tmp/cterm-notarize.zip

          # Submit for notarization
          xcrun notarytool submit /tmp/cterm-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          # Staple the notarization ticket to the app
          xcrun stapler staple "release/cterm.app"

          rm /tmp/cterm-notarize.zip

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          # Create DMG with Applications symlink
          create-dmg \
            --volname "cterm $VERSION" \
            --volicon "release/cterm.app/Contents/Resources/cterm.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "cterm.app" 150 185 \
            --hide-extension "cterm.app" \
            --app-drop-link 450 185 \
            "release/cterm-macos-$VERSION.dmg" \
            "release/cterm.app" || true

          # Fallback if create-dmg fails (e.g., no icon file)
          if [ ! -f "release/cterm-macos-$VERSION.dmg" ]; then
            # Simple DMG creation
            mkdir -p release/dmg-contents
            cp -R release/cterm.app release/dmg-contents/
            ln -s /Applications release/dmg-contents/Applications
            hdiutil create -volname "cterm $VERSION" -srcfolder release/dmg-contents -ov -format UDZO "release/cterm-macos-$VERSION.dmg"
          fi

          # Rename to standard name for artifact
          mv "release/cterm-macos-$VERSION.dmg" "release/cterm-macos-universal.dmg"

      - name: Sign DMG
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          codesign --force --sign "$IDENTITY" --timestamp "release/cterm-macos-universal.dmg"
          codesign --verify --strict --verbose=2 "release/cterm-macos-universal.dmg"

      - name: Notarize DMG
        if: env.APPLE_NOTARIZATION_AVAILABLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          xcrun notarytool submit "release/cterm-macos-universal.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m

          # Staple the notarization ticket to the DMG
          xcrun stapler staple "release/cterm-macos-universal.dmg"

      - name: Sign ctermd binary
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          codesign --force --options runtime \
            --sign "$IDENTITY" \
            --timestamp \
            "universal-binary/ctermd"
          codesign --verify --strict --verbose=2 "universal-binary/ctermd"

      - name: Ad-hoc sign DMG and ctermd binary
        if: env.APPLE_SIGNING_AVAILABLE != 'true'
        run: |
          codesign --force --sign - "release/cterm-macos-universal.dmg"
          codesign --verify --strict --verbose=2 "release/cterm-macos-universal.dmg"
          codesign --force --options runtime --sign - "universal-binary/ctermd"
          codesign --verify --strict --verbose=2 "universal-binary/ctermd"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="/tmp/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Create tar.gz for auto-update (app bundle)
        run: |
          # Create tar.gz of the full app bundle for auto-update
          # This includes the icon, Info.plist, and binary
          cd release && tar -czvf cterm-macos-universal.tar.gz cterm.app

      - name: Create ctermd tar.gz
        run: |
          mkdir -p release/ctermd-macos-universal
          cp universal-binary/ctermd release/ctermd-macos-universal/
          cp README.md LICENSE release/ctermd-macos-universal/
          cp THIRD_PARTY_LICENSES.md release/ctermd-macos-universal/
          cp -R LICENSES release/ctermd-macos-universal/
          cd release && tar -czvf ctermd-macos-universal.tar.gz ctermd-macos-universal

      - name: Generate SHA-256 checksums
        run: |
          cd release
          shasum -a 256 cterm-macos-universal.dmg > cterm-macos-universal.dmg.sha256
          shasum -a 256 cterm-macos-universal.tar.gz > cterm-macos-universal.tar.gz.sha256
          shasum -a 256 ctermd-macos-universal.tar.gz > ctermd-macos-universal.tar.gz.sha256

      - name: Verify packaging contract
        run: |
          (cd release && shasum -a 256 --check cterm-macos-universal.dmg.sha256 cterm-macos-universal.tar.gz.sha256 ctermd-macos-universal.tar.gz.sha256)
          bash scripts/verify_release_package.sh macos-app-tar release/cterm-macos-universal.tar.gz
          bash scripts/verify_release_package.sh macos-dmg release/cterm-macos-universal.dmg
          bash scripts/verify_release_package.sh daemon-tar release/ctermd-macos-universal.tar.gz ctermd-macos-universal

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-macos-dmg
          path: |
            release/cterm-macos-universal.dmg
            release/cterm-macos-universal.dmg.sha256

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v7
        with:
          name: cterm-macos-universal
          path: |
            release/cterm-macos-universal.tar.gz
            release/cterm-macos-universal.tar.gz.sha256

      - name: Upload ctermd tar.gz artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctermd-macos-universal
          path: |
            release/ctermd-macos-universal.tar.gz
            release/ctermd-macos-universal.tar.gz.sha256

  release:
    name: Create Release
    needs: [release-metadata, security-advisories, test-freebsd, test-freebsd-ui, build-linux, build-linux-arm64, build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Verify release asset manifest
        run: bash scripts/verify_release_assets.sh artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cterm-linux-x86_64/cterm-linux-x86_64.tar.gz
            artifacts/cterm-linux-x86_64/cterm-linux-x86_64.tar.gz.sha256
            artifacts/cterm-linux-arm64/cterm-linux-arm64.tar.gz
            artifacts/cterm-linux-arm64/cterm-linux-arm64.tar.gz.sha256
            artifacts/cterm-windows-x86_64/cterm-windows-x86_64.zip
            artifacts/cterm-windows-x86_64/cterm-windows-x86_64.zip.sha256
            artifacts/cterm-windows-installer/cterm-windows-x86_64-setup.exe
            artifacts/cterm-windows-installer/cterm-windows-x86_64-setup.exe.sha256
            artifacts/cterm-macos-universal/cterm-macos-universal.tar.gz
            artifacts/cterm-macos-universal/cterm-macos-universal.tar.gz.sha256
            artifacts/cterm-macos-dmg/cterm-macos-universal.dmg
            artifacts/cterm-macos-dmg/cterm-macos-universal.dmg.sha256
            artifacts/ctermd-linux-x86_64/ctermd-linux-x86_64.tar.gz
            artifacts/ctermd-linux-x86_64/ctermd-linux-x86_64.tar.gz.sha256
            artifacts/ctermd-linux-arm64/ctermd-linux-arm64.tar.gz
            artifacts/ctermd-linux-arm64/ctermd-linux-arm64.tar.gz.sha256
