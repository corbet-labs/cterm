name: Core benchmarks

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/benchmarks.yml
      - Cargo.lock
      - crates/cterm-core/benches/**
      - crates/cterm-core/Cargo.toml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Criterion (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Record runner environment
        run: |
          rustc -Vv
          cargo -V
          uname -a

      - name: Run deterministic core benchmarks
        run: cargo bench -p cterm-core

      - name: Upload Criterion report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cterm-core-criterion-${{ github.run_id }}
          path: target/criterion/
          if-no-files-found: error
          retention-days: 30
