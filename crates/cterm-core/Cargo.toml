[package]
name = "cterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core terminal emulation library for cterm"

[dependencies]
bitflags.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
smol_str.workspace = true
log.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
vte.workspace = true
anyhow.workspace = true
hostname.workspace = true
url.workspace = true
tokio.workspace = true
futures.workspace = true
flate2.workspace = true
serde.workspace = true
base64.workspace = true
regex.workspace = true
image.workspace = true
puressh.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "handleapi", "namedpipeapi", "processthreadsapi", "synchapi", "winbase", "wincon", "winnt", "winerror"] }
shared_memory.workspace = true

[target.'cfg(any(target_os = "freebsd", target_os = "linux", target_os = "macos"))'.dependencies]
nix.workspace = true

[dev-dependencies]
criterion = "0.8.2"
env_logger.workspace = true
tempfile.workspace = true

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "resize_reflow"
harness = false
